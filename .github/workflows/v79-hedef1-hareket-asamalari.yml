name: V79 Hangi Yonde Hangi Asamada Hedef 1

on:
  workflow_dispatch:
  push:
    paths:
      - "veri.txt"
      - "v79_72gun_yon_asama_hedef1_analizi.py"
      - ".github/workflows/v79-hedef1-hareket-asamalari.yml"

permissions:
  contents: read

jobs:
  v79:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NumPy
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compile and nine-movement-stage validation
        run: |
          python -m py_compile v79_72gun_yon_asama_hedef1_analizi.py
          python -u v79_72gun_yon_asama_hedef1_analizi.py --selftest
      - name: Real 72-day 80-ball all target 1 by direction and movement stages
        run: |
          python -u v79_72gun_yon_asama_hedef1_analizi.py --source veri.txt --out v79_output/V79_72_GUN_HANGI_YONDE_HANGI_ASAMADA_HEDEF_1_OLUYOR.zip
      - name: Archive one comprehensive ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V79_HEDEFTE1_72GUN_YON_ASAMA_16LIK_SIRA
          path: v79_output/*.zip
          retention-days: 90
          if-no-files-found: warn
