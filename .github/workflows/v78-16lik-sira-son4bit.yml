name: V78 72 Gun 16lik Havuz Sira 4Bit Hedef 01

on:
  workflow_dispatch:
  push:
    paths:
      - "veri.txt"
      - "v78_16lik_sira_nereden_geldi_son4bit_hedef01.py"
      - ".github/workflows/v78-16lik-sira-son4bit.yml"

permissions:
  contents: read

jobs:
  v78:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NumPy
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compile and selftest the 16x16 movement and last4 1/0 models
        run: |
          python -m py_compile v78_16lik_sira_nereden_geldi_son4bit_hedef01.py
          python -u v78_16lik_sira_nereden_geldi_son4bit_hedef01.py --selftest
      - name: Run 72-day target binary experiment with train validation holdout
        run: |
          python -u v78_16lik_sira_nereden_geldi_son4bit_hedef01.py --source veri.txt --out v78_output/V78_72GUN_16LIK_IC_SIRA_YON_SON4BIT_HEDEF01.zip
      - name: Upload single ZIP with full number identities and 1/0 movement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V78_16LIK_IC_SIRA_KIMLIK_GECIS_SON4BIT_HEDEF01
          path: v78_output/*.zip
          retention-days: 90
          if-no-files-found: warn
