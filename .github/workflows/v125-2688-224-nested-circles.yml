name: V125 2688 Draws 224 Nested Circles

on:
  workflow_dispatch:
  push:
    paths:
      - 'v125_2688_224_icice_12lik_cember_80_sayi.py'
      - '.github/workflows/v125-2688-224-nested-circles.yml'
      - 'veri.txt'

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependency
        run: python -m pip install numpy
      - name: Check source syntax
        run: python -m py_compile v125_2688_224_icice_12lik_cember_80_sayi.py
      - name: Compute 224 nested circles 672 1344 2016 2688 and targets
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u v125_2688_224_icice_12lik_cember_80_sayi.py --source veri.txt --out v125_output/V125_2688_224_HALKA_672_1344_2016_KARSILASTIRMA.zip
      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V125_2688_224_NESTED_672_1344_2016_COMPARISON
          path: v125_output/*.zip
          retention-days: 90
          if-no-files-found: warn
