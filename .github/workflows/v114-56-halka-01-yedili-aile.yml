name: V114 56 Halka 0-1 ve Yedili Aile
on:
  workflow_dispatch:
  push:
    paths:
      - 'v114_56_halka_80_sayi_01_kayit_ve_7li_aile_birlesme.py'
      - '.github/workflows/v114-56-halka-01-yedili-aile.yml'
      - 'veri.txt'
permissions:
  contents: read
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python -m py_compile v114_56_halka_80_sayi_01_kayit_ve_7li_aile_birlesme.py
      - name: Compute actual draw-by-draw all 80 and 7-family reunion
        env:
          OPENBLAS_NUM_THREADS: '2'
        run: python -u v114_56_halka_80_sayi_01_kayit_ve_7li_aile_birlesme.py --source veri.txt --out v114_output/V114_56_HALKA_80_SAYI_01_KAYIT_VE_7LI_AILE.zip
      - name: Save complete audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V114_56_HALKA_01_SAYI_AILE_TUM
          path: v114_output/*.zip
          retention-days: 90
          if-no-files-found: warn
