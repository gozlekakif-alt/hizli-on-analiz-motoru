name: V71 217 Hedef 1291 Isi Pencere Secim Kor Testi

on:
  workflow_dispatch:
  push:
    paths:
      - "veri.txt"
      - "v71_217_cekilis_tum_isi_pencere_test.py"
      - ".github/workflows/v71-217-isi-pencere-test.yml"

permissions:
  contents: read

jobs:
  v71:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NumPy
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compile and selftest
        run: |
          python -m py_compile v71_217_cekilis_tum_isi_pencere_test.py
          python -u v71_217_cekilis_tum_isi_pencere_test.py --selftest
      - name: Scan 217 targets across all 1291 rolling lookbacks
        run: |
          python -u v71_217_cekilis_tum_isi_pencere_test.py --source veri.txt --output v71_output/V71_217_CEKILIS_TUM_SICAKLIK_PENCERE_KOR_TEST.zip
      - name: Upload V71 comprehensive one-file report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V71_217_CEKILIS_1291_ISI_PENCERESI_KUPON
          path: v71_output/*.zip
          retention-days: 90
          if-no-files-found: warn
