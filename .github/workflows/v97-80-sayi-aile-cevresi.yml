name: V97 80 Sayi Kac Farkli Aile 72 Gun

on:
  workflow_dispatch:
  push:
    paths:
      - "veri.txt"
      - "v10_aileler.csv"
      - "v97_80_sayi_kac_farkli_aile_72gun.py"
      - ".github/workflows/v97-80-sayi-aile-cevresi.yml"

permissions:
  contents: read

jobs:
  v97-family-rosters:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy
        run: python -m pip install numpy
      - name: Compile and test
        run: |
          python -m py_compile v97_80_sayi_kac_farkli_aile_72gun.py
          python -u v97_80_sayi_kac_farkli_aile_72gun.py --selftest
      - name: Inspect all 80 balls and family diversity
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          python -u v97_80_sayi_kac_farkli_aile_72gun.py --source veri.txt --catalogue v10_aileler.csv --out v97_output/V97_HER_SAYI_KAC_FARKLI_AILE.zip
      - name: Publish the one complete result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V97_72_GUN_80_SAYI_FARKLI_AILELER
          path: v97_output/*.zip
          if-no-files-found: warn
          retention-days: 90
