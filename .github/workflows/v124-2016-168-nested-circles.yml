name: V124 2016 Draws 168 Nested Circles

on:
  workflow_dispatch:
  push:
    paths:
      - 'v124_2016_168_icice_12lik_cember_80_sayi.py'
      - '.github/workflows/v124-2016-168-nested-circles.yml'
      - 'veri.txt'

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numeric dependency
        run: python -m pip install numpy
      - name: Compile and syntax check
        run: python -m py_compile v124_2016_168_icice_12lik_cember_80_sayi.py
      - name: Analyze 168 nested 12 step rings and compare 672 1344 2016
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u v124_2016_168_icice_12lik_cember_80_sayi.py --source veri.txt --out v124_output/V124_2016_168_HALKA_672_1344_KARSILASTIRMA.zip
      - name: Upload all files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V124_2016_168_NESTED_672_1344_COMPARISON
          path: v124_output/*.zip
          retention-days: 90
          if-no-files-found: warn
