name: V90 Markov LSTM 48 Hafiza 12 Hedef RNG Kontrol

on:
  workflow_dispatch:
  push:
    paths:
      - "veri.txt"
      - "v90_markov_lstm_48_gecmis_12_hedef.py"
      - ".github/workflows/v90-markov-lstm-48-12.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install real CPU PyTorch and NumPy
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify LSTM torch is real and V90 compiles
        run: |
          python -m py_compile v90_markov_lstm_48_gecmis_12_hedef.py
          python -u v90_markov_lstm_48_gecmis_12_hedef.py --selftest
      - name: Run chronological 48 to next12 Markov vs real LSTM holdout
        run: |
          python -u v90_markov_lstm_48_gecmis_12_hedef.py --source veri.txt --out v90_output/V90_MARKOV_LSTM_48_12_KAYAN_SAYI_KARSILASTIRMASI.zip
      - name: Save audited V90 single ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V90_MARKOV_LSTM_48_12_KAYAN_4_5_6_ISABET
          path: v90_output/*.zip
          retention-days: 90
          if-no-files-found: warn
