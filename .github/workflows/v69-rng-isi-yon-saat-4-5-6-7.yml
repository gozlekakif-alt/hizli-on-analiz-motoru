name: V69 RNG Isi Yon ve Saat 4 5 6 7 Kor Testi

on:
  workflow_dispatch:
  push:
    paths:
      - "veri.txt"
      - "v69_rng_isi_yon_saat_4_5_6_7.py"
      - ".github/workflows/v69-rng-isi-yon-saat-4-5-6-7.yml"

permissions:
  contents: read

jobs:
  v69:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NumPy
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compile and validate chronological predictions
        run: |
          python -m py_compile v69_rng_isi_yon_saat_4_5_6_7.py
          python -u v69_rng_isi_yon_saat_4_5_6_7.py --selftest
      - name: Full 217 draws and 1000 independent RNG day simulations
        run: |
          python -u v69_rng_isi_yon_saat_4_5_6_7.py --source veri.txt --sims 1000 --out v69_output/V69_RNG_ISI_YON_SAAT_4_5_6_7_KOR_TEST.zip
      - name: Store V69 all reports together
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V69_RNG_ISI_YON_SAAT_4_5_6_7
          path: v69_output/*.zip
          retention-days: 90
          if-no-files-found: warn
