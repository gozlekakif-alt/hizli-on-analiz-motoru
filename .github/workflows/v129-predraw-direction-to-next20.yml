name: V129 Pre-Draw 224-Ring Direction vs Next 20 Hits

on:
  workflow_dispatch:
  push:
    paths:
      - 'v129_hedef_oncesi_224_halka_yon_20_sayi_etki_test.py'
      - '.github/workflows/v129-predraw-direction-to-next20.yml'
      - 'veri.txt'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: NumPy
        run: python -m pip install numpy
      - name: Compile V129
        run: python -m py_compile v129_hedef_oncesi_224_halka_yon_20_sayi_etki_test.py
      - name: Replay pre-target movement and test real target membership
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          python -u v129_hedef_oncesi_224_halka_yon_20_sayi_etki_test.py --source veri.txt --out v129_output/V129_HEDEF_ONCESI_224_HALKA_YON_ETKI_KOR_TEST.zip
      - name: Audit successful ZIP and no-future leakage
        if: success()
        run: |
          python - <<'PY'
          import zipfile,json
          p="v129_output/V129_HEDEF_ONCESI_224_HALKA_YON_ETKI_KOR_TEST.zip"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              d=json.loads(z.read("08_V129_DENETIM.json"))
              assert d["max_ring_length"]==2688 and d["num_nested_windows"]==224
              assert d["targets"]>=13000 and len(d["selection_models"])>=20
              assert d["from_previous_observed_draw_only"]
              print("Verified V129",d["targets"],"next-draw targets,",
                    len(d["signal_names"]),"predraw signals,",
                    len(d["selection_models"]),"equal-budget models")
          PY
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V129_PREDRAW_224_RING_DIRECTION_NEXT20_BLIND_AUDIT
          path: v129_output/*.zip
          retention-days: 90
          if-no-files-found: warn
