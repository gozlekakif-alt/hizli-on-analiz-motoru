name: V83 434 Gecmis 36x12 Yoldan Son12 Kupon Kor Test

on:
  workflow_dispatch:
  push:
    paths:
      - "veri.txt"
      - "v83_434_36x12_hareketten_son12_kupon_kor_test.py"
      - ".github/workflows/v83-434-onceden-kupon-kor-test.yml"

permissions:
  contents: read

jobs:
  v83:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install NumPy
        run: python -m pip install "numpy>=1.24,<3"
      - name: Compile and test 37 historical stages and 10-subset-of-20 invariants
        run: |
          python -m py_compile v83_434_36x12_hareketten_son12_kupon_kor_test.py
          python -u v83_434_36x12_hareketten_son12_kupon_kor_test.py --selftest
      - name: Run chronologically frozen next12 coupon and matched random holdout
        run: |
          python -u v83_434_36x12_hareketten_son12_kupon_kor_test.py --source veri.txt --out v83_output/V83_434CEKILIS_36x12_HAREKETTEN_KUPON10_HEDEF20_KOR_TEST.zip
      - name: Save full results single ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V83_434_GECMIS_36x12_ONCEDEN_10LU_20LI_KOR_TEST
          path: v83_output/*.zip
          retention-days: 90
          if-no-files-found: warn
