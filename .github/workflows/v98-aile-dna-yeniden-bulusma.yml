name: V98 Aile DNA Yeniden Bulusma Kor Test

on:
  workflow_dispatch:
  push:
    paths:
      - "veri.txt"
      - "v98_aile_dna_yeniden_bulusma_kor_test.py"
      - ".github/workflows/v98-aile-dna-yeniden-bulusma.yml"

permissions:
  contents: read

jobs:
  v98-family-dna:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install numpy
      - name: Compile and selftest
        run: |
          python -m py_compile v98_aile_dna_yeniden_bulusma_kor_test.py
          python -u v98_aile_dna_yeniden_bulusma_kor_test.py --selftest
      - name: Run historical family DNA signal holdout
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          python -u v98_aile_dna_yeniden_bulusma_kor_test.py --source veri.txt --out v98_output/V98_AILE_DNA_YENIDEN_BULUSMA_KOR_TEST.zip
      - name: Publish V98 full result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V98_AILE_DNA_YENIDEN_BULUSMA_KOR_TEST
          path: v98_output/*.zip
          retention-days: 90
          if-no-files-found: warn
