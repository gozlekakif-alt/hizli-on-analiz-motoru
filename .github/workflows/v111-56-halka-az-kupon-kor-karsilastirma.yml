name: V111 56 Halka Az Kupon Gercek Isabet Karsilastirma

on:
  workflow_dispatch:
  push:
    paths:
      - 'veri.txt'
      - 'v111_56_halka_tam_yon_zinciri_az_kupon_karsilastir.py'
      - '.github/workflows/v111-56-halka-az-kupon-kor-karsilastirma.yml'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Syntax and mathematical selftest
        run: |
          python -m py_compile v111_56_halka_tam_yon_zinciri_az_kupon_karsilastir.py
          python -u v111_56_halka_tam_yon_zinciri_az_kupon_karsilastir.py --selftest
      - name: Train first36 and compare next36 plus Oct13 without future leakage
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          python -u v111_56_halka_tam_yon_zinciri_az_kupon_karsilastir.py --source veri.txt --out v111_output/V111_56_HALKA_AZ_KUPON_10DA10_KARSILASTIR.zip
      - name: Upload scored tickets, complete history and independent controls
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V111_TAM56_HALKA_AZ_KUPON_KARSILASTIR
          path: v111_output/*.zip
          retention-days: 90
          if-no-files-found: warn
