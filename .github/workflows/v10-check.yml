name: V10 Kod Kontrolü
on:
  push:
    paths:
      - 'v10_app.py'
      - 'v10_selftest.py'
      - 'v10_streamlit_test.py'
      - 'v10_real_data_test.py'
      - '.github/workflows/v10-check.yml'
  workflow_dispatch:
jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile v10_app.py
      - name: Check timing, family models and coupon outcomes
        run: python v10_selftest.py
      - name: Check against actual 72-day data and family list
        run: python v10_real_data_test.py
      - name: Install Streamlit runtime
        run: pip install 'streamlit>=1.39,<2' 'requests>=2.31,<3'
      - name: Launch Streamlit and verify UI
        run: python v10_streamlit_test.py
