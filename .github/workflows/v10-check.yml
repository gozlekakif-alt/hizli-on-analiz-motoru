name: V10 Kod Kontrolü
on:
  push:
    paths:
      - 'v10_app.py'
      - 'v10_sira.py'
      - 'v10_geliyorum.py'
      - 'v10_alti_ritim.py'
      - 'v10_alti_ritim_test.py'
      - 'v11_arastirma.py'
      - 'v11_selftest.py'
      - 'v12_80_kule.py'
      - 'v12_selftest.py'
      - 'v13_havuz_koltuk.py'
      - 'v13_selftest.py'
      - 'v14_gecis_agi.py'
      - 'v14_selftest.py'
      - 'v10_selftest.py'
      - 'v10_streamlit_test.py'
      - 'v10_real_data_test.py'
      - '.github/workflows/v10-check.yml'
  workflow_dispatch:
jobs:
  syntax-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m py_compile v10_app.py v10_sira.py v10_geliyorum.py v10_alti_ritim.py v10_alti_ritim_test.py v11_arastirma.py v11_selftest.py v12_80_kule.py v12_selftest.py v13_havuz_koltuk.py v13_selftest.py v14_gecis_agi.py v14_selftest.py
      - name: Check timing, family models and coupon outcomes
        run: python v10_selftest.py
      - name: Check against actual 72-day data and family list
        run: python v10_real_data_test.py
      - name: Verify 6-family gap motor and 74-day walk-forward results
        run: python v10_alti_ritim_test.py
      - name: Verify 73-day 12x20 V11 research without future draw leakage
        run: python v11_selftest.py
      - name: Verify 80-number tower and complete 2–10 family audit
        run: python v12_selftest.py
      - name: Verify 217-slot thermal seat and V12 family model against 37 held-out days
        run: python v13_selftest.py
      - name: Test 217-position 80x80 transition tower and 37 held-out days
        run: python v14_selftest.py
      - name: Install Streamlit runtime
        run: pip install 'streamlit>=1.39,<2' 'requests>=2.31,<3'
      - name: Launch Streamlit and verify UI
        run: python v10_streamlit_test.py
