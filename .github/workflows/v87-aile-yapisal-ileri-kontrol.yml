name: V87 Aile Degisimleri Sonraki 1 3 6 12 Isabet Denetim

on:
  workflow_dispatch:
  push:
    paths:
      - "veri.txt"
      - "v87_aile_donusum_sonrasi_1_3_6_12_isabet_kontrol.py"
      - ".github/workflows/v87-aile-yapisal-ileri-kontrol.yml"

permissions:
  contents: read

jobs:
  v87:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test structural relations and family quota
        run: |
          python -m py_compile v87_aile_donusum_sonrasi_1_3_6_12_isabet_kontrol.py
          python -u v87_aile_donusum_sonrasi_1_3_6_12_isabet_kontrol.py --selftest
      - name: Audit every 72-day origin and next1 next3 next6 next12 targets
        run: |
          python -u v87_aile_donusum_sonrasi_1_3_6_12_isabet_kontrol.py --source veri.txt --out v87_output/V87_72GUN_AILE_YAPISAL_SINYAL_4_HEDEF_UFUK.zip
      - name: Publish full single V87 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V87_AILE_YAPISAL_1_3_6_12_GERCEK_ISABET
          path: v87_output/*.zip
          retention-days: 90
          if-no-files-found: warn
