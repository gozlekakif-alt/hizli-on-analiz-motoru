name: V101 Yuruyen Halka 1-12 Asama Fayda Kontrolu
on:
  workflow_dispatch:
  push:
    paths:
      - 'veri.txt'
      - 'v100c_yuruyen_672_fifo_sabit_12_halka.py'
      - 'v101_yuruyen_672_halqa_1_12_fayda_kor_test.py'
      - '.github/workflows/v101-halka-1-12-fayda.yml'
permissions:
  contents: read
jobs:
  stage-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numpy
        run: python -m pip install numpy
      - name: Self-test
        run: |
          python -m py_compile v101_yuruyen_672_halqa_1_12_fayda_kor_test.py
          python -u v101_yuruyen_672_halqa_1_12_fayda_kor_test.py --selftest
      - name: Run exact 1-12 ring-stage and next-target audit
        env:
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          python -u v101_yuruyen_672_halqa_1_12_fayda_kor_test.py --source veri.txt --out v101_output/V101_YURUYEN_HALKA_1_12_12_ASAMA_FAYDA_DENETIM.zip
      - name: Archive all phase diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V101_YURUYEN_HALKADA_12_ASAMA_10_YONTEM
          path: v101_output/*.zip
          if-no-files-found: warn
          retention-days: 90
