name: V24 Aile Ilkden Ikinciye Kor Test
on:
  push:
    paths:
      - 'v24_aile_ikinci_ongoru.py'
      - 'v24_selftest.py'
      - 'v24_family_app.py'
      - '.github/workflows/v24-check.yml'
  workflow_dispatch:
jobs:
  v24:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and integration
        run: python -m py_compile v24_aile_ikinci_ongoru.py v24_selftest.py v24_family_app.py v10_app.py
      - name: No-lookahead and exact first-appearance test
        run: python -u v24_selftest.py
      - name: All 72 full days prospective first-to-second replay
        run: python -u v24_aile_ikinci_ongoru.py --output V24_ILK_2INCI_AILE_72_GUN.zip
      - name: Upload full reports as ZIP
        uses: actions/upload-artifact@v4
        with:
          name: V24-72-Gun-Ilkden-Ikinciye-Aile
          path: V24_ILK_2INCI_AILE_72_GUN.zip
          retention-days: 30
          if-no-files-found: error
