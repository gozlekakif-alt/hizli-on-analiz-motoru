name: V131 Publish Hot Pool Reversal Real Findings

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v131-publish-release.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Recover fully calculated V131 results
        uses: actions/download-artifact@v4
        with:
          run-id: 39017306865
          name: V131_HOT_POOL_PRE_ENTRY_REVERSAL_FAST_BOUNCE_224_RINGS
          github-token: ${{ github.token }}
          path: v131-release
      - name: Cross-check key short and long rings at 1 3 6 12 24 36 steps
        run: |
          python - <<'PY'
          import csv,io,json,zipfile
          p="v131-release/V131_SICAGA_GIRIS_TERS_YON_224_HALKA_36_TAKIP.zip"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              q=json.loads(z.read("04_V131_KAYNAK_KONTROL.json"))
              assert q["source_rows"]==15790 and q["nested_ring_count"]==224
              x=list(csv.DictReader(io.StringIO(z.read("01_224_HALKA_HER_GIRIS_TURU_1_3_6_12_24_36_CIKIS.csv").decode("utf-8-sig"))))
              def row(e,r,h):
                  return next(y for y in x if y["event"]==e and y["group"]==r and y["horizon"]==str(h))
              for L in (12,72,672,1344,2016,2688):
                  r="RING_%03d_L%d"%(L//12,L)
                  print("V131 LOOKBACK",L)
                  for h in (1,3,6,12,24,36):
                      hot=row("ENTER_HOT",r,h)
                      incumb=row("ESTABLISHED_HOT",r,h)
                      warm=row("APPROACH_ILIK",r,h)
                      print(" after",h,
                         "hot NEW exits",hot["first_decisive_rate_pct"]+"%",
                         "hot ESTABLISHED exits",incumb["first_decisive_rate_pct"]+"%",
                         "warm APPROACH reverses before hot",warm["cooling_reversal_before_hot_pct"]+"%",
                         "warm APPROACH reaches hot",warm["reached_hot_before_cooling_pct"]+"%",
                         "new hot reaches actual cold0",hot["actual_cold_pool0_rate_pct"]+"%")
              allhot=row("ENTER_HOT","ALL_RINGS",12)
              assert int(allhot["events"])>1000000
              print("V131 verified",q["event_count_hot_entries"],"new hot entries and",
                q["event_count_approach_ilik"],"approaching warm-group entries")
          PY
      - name: Store permanently as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v131-2026-10-13-hot-entry-reversal-224-rings
        run: |
          FILE=v131-release/V131_SICAGA_GIRIS_TERS_YON_224_HALKA_36_TAKIP.zip
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "V131 — 224 Rings: Reversal Before Hot and Bounce Right After Entry" \
              --notes "15,790 real historical results, 224 overlapping rings of 12..2688 draws, all 80 balls. Counted 1,985,775 upward entries to warm class3 before hot and 1,484,412 new entries into hot class4, using only 13,066 historical event steps with all next36 real draws observed. After entering hot, 76.60575% exit hot by 12 draws (across all nested rings, strongly dependent); reaching actual bottom COLD0 in 12 is only 0.91033%. In 672-ring, 75.70952% of newly hot entries exit hot in 12 vs 16.24329% for established hot members; immediate 12-ring exits differ from long rings. Before reaching hot, of 1,985,775 NEW warm-class3 entrants, 72.46919% reverse to cooler class first by 12, 5.93577% reach hot first, rest still warm. Detailed per-ring per-horizon and 80-number aggregate tables and latest-archive entry list. These are retrospective pool-position movements, NOT proof of ability to predict next 20 RNG draw." \
              --latest=false
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url: .url, assets: [.assets[]|{name,size}]}'
