name: V132 Hot Entrants vs Established Next 20

on:
  workflow_dispatch:
  push:
    paths:
      - 'v132_sicaga_yeni_giren_ve_yerlesik_hedef20_oncu_test.py'
      - '.github/workflows/v132-hot-new-vs-incumbent-next20.yml'
      - 'veri.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Check Python syntax
        run: python -m py_compile v132_sicaga_yeni_giren_ve_yerlesik_hedef20_oncu_test.py
      - name: Test 224 hot-entrant and incumbent groups before next draw
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python -u v132_sicaga_yeni_giren_ve_yerlesik_hedef20_oncu_test.py --source veri.txt --out v132_output/V132_YENI_SICAK_YERLESIK_SICAK_HEDEF20_KARSILASTIRMA.zip
      - name: Check archival integrity
        if: success()
        run: |
          python - <<'PY'
          import json,zipfile
          z=zipfile.ZipFile("v132_output/V132_YENI_SICAK_YERLESIK_SICAK_HEDEF20_KARSILASTIRMA.zip")
          assert z.testzip() is None
          j=json.loads(z.read("10_METOD_DENETIM.json"))
          assert j["targets"]==13101 and len(j["all_224_nested_rings"])==224
          assert j["future_data_used_to_choose"]==False
          print("V132 verified",j["targets"],"forward-in-time next-20 outcomes and",len(z.namelist()),"result tables")
          PY
      - name: Publish workflow output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V132_NEW_HOT_VS_ESTABLISHED_NEXT20_224_RINGS
          path: v132_output/*.zip
          retention-days: 90
          if-no-files-found: warn
