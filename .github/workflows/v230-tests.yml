name: V230 night hub tests
on:
  push:
    paths:
      - v230_gece_merkezi.py
      - tests/test_v230.py
      - .github/workflows/v230-tests.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dashboard dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "numpy>=1.24,<3"
      - name: Check dashboard syntax and behavior
        run: python -m unittest discover -s tests -p 'test_v230.py' -v
